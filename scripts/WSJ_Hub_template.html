  if (pos >= 0) window._materialTopics.splice(pos, 1);
  else window._materialTopics.push(t);
  renderMaterials();
}
window.toggleMaterialTopicIdx = toggleMaterialTopicIdx;

function renderMaterials(registry) {
  registry = registry || getRegistry();
  const list = document.getElementById('material-list');
  if (!list) return;
  const searchInput = document.getElementById('material-search');
  if (searchInput && searchInput.value !== window._materialSearch) searchInput.value = window._materialSearch;
  const sortSel = document.getElementById('material-sort');
  if (sortSel && sortSel.value !== window._materialSort) sortSel.value = window._materialSort;

  const all = getMaterials();

  // 主题 chips（逗号拆分后的全集，按出现次数排序）
  const topicCount = {};
  all.forEach(m => mtopicsOf(m).forEach(t => { topicCount[t] = (topicCount[t] || 0) + 1; }));
  const topics = Object.keys(topicCount).sort((a, b) => topicCount[b] - topicCount[a] || a.localeCompare(b));
  window._materialTopicList = topics;

  // 类型 chips
  let chips = '<div class="chip-row">';
  chips += `<button class="${window._materialType === 'all' ? 'active' : ''}" onclick="setMaterialType('all')">全部 (${all.length})</button>`;
  MATERIAL_TYPE_ORDER.forEach(t => {
    const n = all.filter(m => mtypeOf(m) === t).length;
    chips += `<button class="${window._materialType === t ? 'active' : ''}" onclick="setMaterialType('${t}')">${MATERIAL_TYPE_META[t].chip} (${n})</button>`;
  });
  chips += '</div>';
  // 主题 chips（多选 AND）
  if (topics.length > 0) {
    chips += '<div class="chip-row">';
    topics.forEach((t, i) => {
      const on = window._materialTopics.includes(t);
      chips += `<button class="${on ? 'active' : ''}" title="点击${on ? '取消' : ''}筛选该主题（可多选，取交集）" onclick="toggleMaterialTopicIdx(${i})">${esc(t)} (${topicCount[t]})</button>`;
    });
    chips += '</div>';
  }

  // 过滤：类型 → 主题 AND → 全文搜索
  let arr = all;
  if (window._materialType !== 'all') arr = arr.filter(m => mtypeOf(m) === window._materialType);
  if (window._materialTopics.length > 0) {
    arr = arr.filter(m => {
      const ts = mtopicsOf(m);
      return window._materialTopics.every(sel => ts.includes(sel));
    });
  }
  const q = (window._materialSearch || '').trim().toLowerCase();
  if (q) {
    arr = arr.filter(m => {
      const meta = MATERIAL_TYPE_META[mtypeOf(m)];
      const hay = [m.sourceText, m.topic, m.usage, m.template]
        .concat(meta.fields.map(f => m[f[0]]))
        .map(v => String(v == null ? '' : v)).join('\n').toLowerCase();
      return hay.includes(q);
    });
  }
  // 排序：最新 / 最常用
  arr = arr.slice().sort((a, b) => {
    if (window._materialSort === 'used') {
      const d = (b.usedCount || 0) - (a.usedCount || 0);
      if (d !== 0) return d;
    }
    return String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
  });

  const titleOf = id => {
    const r = registry.find(x => x.id === id);
    return r ? (r.title || r.id) : (id || '');
  };
  const line = (m, key, label, ph) => `
    <div class="m-line">
      <span class="m-label">${label}</span>
      <div class="m-edit" contenteditable="true" data-mid="${esc(m.id)}" data-mkey="${key}" data-placeholder="${ph || '（点击填写）'}" onblur="updateMaterial(this)">${esc(m[key] || '')}</div>
    </div>`;

  let html = chips;
  if (arr.length === 0) {
    html += all.length === 0
      ? '<div class="empty-state"><h2>素材本还是空的</h2><p>在文章页选中文字 → ✍️ 存为素材，<br>素材会按主题汇总到这里。</p></div>'
      : '<div class="empty-state"><h2>没有匹配的素材</h2><p>试试调整搜索词、类型或主题筛选。</p></div>';
    list.innerHTML = html;
    return;
  }
  html += `<div class="m-count">共 ${arr.length} 条素材 · 按${window._materialSort === 'used' ? '使用次数' : '创建时间'}排序</div>`;
  arr.forEach(m => {
    const meta = MATERIAL_TYPE_META[mtypeOf(m)];
    const used = m.usedCount || 0;
    const topicBadges = mtopicsOf(m).map(x => `<span class="badge-topic">${esc(x)}</span>`).join('') || '<span class="badge-topic">未分类</span>';
    let fieldsHtml = meta.fields.map(f => line(m, f[0], f[1])).join('');
    if (m.logic) fieldsHtml += line(m, 'logic', '逻辑'); // 兼容旧字段
    html += `
      <div class="material-card" data-mcard="${esc(m.id)}">
        <button class="m-del" title="删除" onclick="deleteMaterial('${esc(m.id)}')">✕</button>
        <div class="m-type-row">
          <span class="badge-mtype ${meta.cls}">${meta.label}</span>
          ${topicBadges}
          ${used > 0 ? `<span class="m-used-badge">已用 ${used} 次</span>` : ''}
        </div>
        <div class="m-source m-edit" contenteditable="true" data-mid="${esc(m.id)}" data-mkey="sourceText" data-placeholder="（原文摘录…）" onblur="updateMaterial(this)">${esc(m.sourceText || '')}</div>
        ${fieldsHtml}
        ${line(m, 'topic', '主题', '（多个主题用逗号分隔）')}
        <details class="m-usage">
          <summary>用法与模板${(m.usage || m.template) ? '' : '（空）'}</summary>
          ${line(m, 'usage', '用法', '（这条素材怎么用…）')}
          ${line(m, 'template', '模板', '（可套用的写作模板…）')}
        </details>
        <div class="m-meta">
          ${m.articleId ? `<span class="m-art-link" onclick="openArticle('${esc(m.articleId)}')">${esc(titleOf(m.articleId))}</span>` : ''}
          ${m.createdAt ? ' · ' + fmtHubDate(m.createdAt) : ''}
          ${m.lastUsedAt ? ' · 最近使用 ' + fmtHubDate(m.lastUsedAt) : ''}
          <button class="m-use-btn" onclick="markMaterialUsed('${esc(m.id)}')">✔ 标记已用</button>
        </div>
      </div>`;
  });
  list.innerHTML = html;
}

window.updateMaterial = function (el) {
  const arr = getMaterials();
  const m = arr.find(x => x.id === el.dataset.mid);
  if (!m) return;
  m[el.dataset.mkey] = el.textContent.trim();
  saveMaterials(arr);
};

window.markMaterialUsed = function (id) {
  const arr = getMaterials();
  const m = arr.find(x => x.id === id);
  if (!m) return;
  m.usedCount = (m.usedCount || 0) + 1;
  m.lastUsedAt = new Date().toISOString();
  saveMaterials(arr);
  // 就地更新徽章，避免重渲染丢失 <details> 展开状态
  const card = document.querySelector('.material-card[data-mcard="' + id + '"]');
  if (card) {
    let badge = card.querySelector('.m-used-badge');
    if (!badge) {
      badge = document.createElement('span');
      badge.className = 'm-used-badge';
      const row = card.querySelector('.m-type-row');
      if (row) row.appendChild(badge);
    }
    if (badge) badge.textContent = '已用 ' + m.usedCount + ' 次';
  }
};

window.deleteMaterial = function (id) {
  saveMaterials(getMaterials().filter(x => x.id !== id));
  renderMaterials();
};

// ===== 全局笔记搜索 =====
window._hubSearchTimer = null;
const BUCKET_BADGE = {
  vocab: { label: '生词', cls: 'badge-bucket-vocab' },
  note:  { label: '笔记', cls: 'badge-bucket-note' },
  qtype: { label: '题型', cls: 'badge-bucket-qtype' }
};

function onHubSearchInput(el) {
  clearTimeout(window._hubSearchTimer);
  const v = el.value;
  window._hubSearchTimer = setTimeout(() => runHubSearch(v), 250);
}
window.onHubSearchInput = onHubSearchInput;

function onHubSearchKeydown(e) {
  if (e.key === 'Escape') {
    e.target.value = '';
    clearTimeout(window._hubSearchTimer);
    hideHubSearchResults();
  }
}
window.onHubSearchKeydown = onHubSearchKeydown;

function hideHubSearchResults() {
  const p = document.getElementById('hub-search-results');
  if (p) { p.style.display = 'none'; p.innerHTML = ''; }
}
window.hideHubSearchResults = hideHubSearchResults;

function hubSearchFields(a) {
  const qd = a.qdata || {};
  const fields = [];
  if (a.text) fields.push(String(a.text));
  if (a.note) fields.push(String(a.note));
  if (a.context) fields.push(String(a.context));
  if (Array.isArray(a.tags) && a.tags.length) fields.push(a.tags.map(String).join(' / '));
  Object.values(qd).forEach(v => {
    if (typeof v === 'string' && v) fields.push(v);
    else if (Array.isArray(v) && v.length) fields.push(v.map(String).join(' / '));
  });
  return fields;
}

function hubSnippet(text, term) {
  const idx = text.toLowerCase().indexOf(term.toLowerCase());
  if (idx < 0) return esc(String(text).slice(0, 90));
  const start = Math.max(0, idx - 30);
  const end = Math.min(text.length, idx + term.length + 60);
  return (start > 0 ? '…' : '') + esc(text.slice(start, idx)) +
    '<mark>' + esc(text.slice(idx, idx + term.length)) + '</mark>' +
    esc(text.slice(idx + term.length, end)) + (end < text.length ? '…' : '');
}

function runHubSearch(raw) {
  const panel = document.getElementById('hub-search-results');
  if (!panel) return;
  const query = (raw || '').trim();
  if (!query) { hideHubSearchResults(); return; }
  let tagMode = false, term = query;
  if (/^tag:/i.test(query)) { tagMode = true; term = query.slice(4).trim(); }
  if (!term) { hideHubSearchResults(); return; }
  const low = term.toLowerCase();
  const results = [];
  const registry = getRegistry();
  for (const r of registry) {
    const annos = getAnnotations(r.id);
    for (const a of annos) {
      let matched = null;
      if (tagMode) {
        if (Array.isArray(a.tags) && a.tags.some(t => String(t).toLowerCase().includes(low))) {
          matched = a.tags.map(String).join(' / ');
        }
      } else {
        for (const f of hubSearchFields(a)) {
          if (f.toLowerCase().includes(low)) { matched = f; break; }
        }
      }
      if (matched != null) {
        results.push({ r, a, matched });
        if (results.length >= 30) break;
      }
    }
    if (results.length >= 30) break;
  }
  let html = `<div class="hsr-head-bar"><span>${tagMode ? '标签搜索' : '搜索'} “${esc(term)}” · ${results.length} 条${results.length >= 30 ? '（仅显示前 30 条）' : ''}</span><button title="关闭" onclick="hideHubSearchResults()">✕</button></div>`;
  if (results.length === 0) {
    html += '<div class="hsr-empty">没有匹配的笔记 / 标注（试试 tag:标签 语法）</div>';
  } else {
    results.forEach(res => {
      const bb = BUCKET_BADGE[res.a.bucket] || { label: res.a.bucket || '标注', cls: 'badge-bucket-note' };
      html += `
        <div class="hsr-item" onclick="openArticle('${esc(res.r.id)}')">
          <div><span class="badge-bucket ${bb.cls}">${esc(bb.label)}</span><span class="hsr-title">${esc(res.r.title || res.r.id)}</span></div>
          <div class="hsr-snippet">${hubSnippet(res.matched, term)}</div>
        </div>`;
    });
  }
  panel.innerHTML = html;
  panel.style.display = 'block';
}

// ===== Backup / Restore =====
function hubBackup() {
  const data = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (/^(annotations:|reading:|settings:|syntax:|summary:|translation:|wsj_review:|wsj_reader:)/.test(k) || k === 'wsj_writing:materials' || k === 'wsj_roots:cards') {
      data[k] = localStorage.getItem(k);
    }
  }
  if (Object.keys(data).length === 0) { alert('暂无可备份的数据'); return; }
  const payload = { app: 'english-reader-backup', version: 1, createdAt: new Date().toISOString(), data };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  a.href = URL.createObjectURL(blob);
  a.download = 'reader-backup-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function hubRestore() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json,application/json';
  input.addEventListener('change', () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const payload = JSON.parse(reader.result);
        if (!payload || payload.app !== 'english-reader-backup' || !payload.data) { alert('无效的备份文件'); return; }
        if (!confirm('将覆盖当前所有笔记/标注数据，继续？')) return;
        Object.entries(payload.data).forEach(([k, v]) => localStorage.setItem(k, v));
        alert('恢复成功，即将刷新');
        setTimeout(() => location.reload(), 500);
      } catch(e) { alert('备份文件解析失败：' + e.message); }
    };
    reader.readAsText(file);
  });
  input.click();
}

async function initHub() {
  // Use hardcoded article list (PREFILL_ARTICLES)
  // User can also scan a folder to add more articles
  const registry = getRegistry();
  if (registry.length === 0) {
    const status = document.getElementById('folder-info');
    status.textContent = '⏳ 正在加载 ' + PREFILL_ARTICLES.length + ' 篇文章…';
    status.classList.add('visible');
    for (const meta of PREFILL_ARTICLES) {
      const entry = {
        id: meta.id, title: meta.title, cnTitle: meta.cnTitle,
        author: meta.author, annotationCount: 0,
        updatedAt: new Date().toISOString()
      };
      const existing = registry.findIndex(r => r.id === meta.id);
      if (existing >= 0) registry[existing] = entry;
      else registry.push(entry);
      saveRegistry(registry);
      saveArticle(meta.id, {
        id: meta.id, title: meta.title, cnTitle: meta.cnTitle,
        author: meta.author, meta: '',
        enParas: [], cnParas: [],
        annotationCount: 0, updatedAt: new Date().toISOString()
      });
    }
    localStorage.setItem('wsj_hub:lastFolder', 'prefill (' + PREFILL_ARTICLES.length + ' articles)');

  renderAll();
}
